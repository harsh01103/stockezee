[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockezee"
version = "1.0.0"
description = "Explainable AI stock screener and backtester for Indian (NSE) equities"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "fastapi"]

[tool.setuptools]
packages = ["stockezee"]
