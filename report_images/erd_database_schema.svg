<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="erdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowErd">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="12" fill="url(#erdBg)"/>
  
  <!-- Header -->
  <text x="500" y="36" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">ENTITY RELATIONSHIP DIAGRAM (ERD) — DATABASE SCHEMA</text>
  <text x="500" y="56" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">PostgreSQL Supabase Relational &amp; Real-Time High-Frequency Persistence Architecture</text>

  <!-- Table 1: live_options_ticks -->
  <rect x="40" y="80" width="280" height="240" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowErd)"/>
  <rect x="40" y="80" width="280" height="32" rx="6" fill="#0284c7"/>
  <text x="55" y="102" fill="#ffffff" font-family="'Consolas', monospace" font-size="13" font-weight="bold">live_options_ticks</text>

  <g font-family="'Consolas', monospace" font-size="11">
    <text x="55" y="130" fill="#facc15">PK  tick_id : UUID</text>
    <text x="55" y="152" fill="#e2e8f0">    instrument_key : VARCHAR(50)</text>
    <text x="55" y="174" fill="#e2e8f0">    exchange_time : TIMESTAMPTZ</text>
    <text x="55" y="196" fill="#e2e8f0">    underlying : VARCHAR(20)</text>
    <text x="55" y="218" fill="#e2e8f0">    strike : NUMERIC(10,2)</text>
    <text x="55" y="240" fill="#e2e8f0">    option_type : CHAR(2) [CE/PE]</text>
    <text x="55" y="262" fill="#e2e8f0">    ltp, bid, ask : NUMERIC(10,2)</text>
    <text x="55" y="284" fill="#e2e8f0">    volume, oi : BIGINT</text>
    <text x="55" y="306" fill="#a7f3d0">    transit_latency_ms : INTEGER</text>
  </g>

  <!-- Table 2: trade_signals -->
  <rect x="360" y="80" width="280" height="240" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadowErd)"/>
  <rect x="360" y="80" width="280" height="32" rx="6" fill="#059669"/>
  <text x="375" y="102" fill="#ffffff" font-family="'Consolas', monospace" font-size="13" font-weight="bold">trade_signals</text>

  <g font-family="'Consolas', monospace" font-size="11">
    <text x="375" y="130" fill="#facc15">PK  signal_id : UUID</text>
    <text x="375" y="152" fill="#38bdf8">FK  tick_id : UUID</text>
    <text x="375" y="174" fill="#e2e8f0">    created_at : TIMESTAMPTZ</text>
    <text x="375" y="196" fill="#e2e8f0">    regime_confidence : NUMERIC(5,2)</text>
    <text x="375" y="218" fill="#e2e8f0">    z_vwoim, z_oi_flow : NUMERIC(6,3)</text>
    <text x="375" y="240" fill="#e2e8f0">    delta, gamma, vanna : FLOAT</text>
    <text x="375" y="262" fill="#e2e8f0">    friction_hurdle : NUMERIC(6,3)</text>
    <text x="375" y="284" fill="#e2e8f0">    ml_approval_prob : NUMERIC(5,4)</text>
    <text x="375" y="306" fill="#a7f3d0">    gating_status : VARCHAR(20)</text>
  </g>

  <!-- Table 3: executed_orders -->
  <rect x="680" y="80" width="280" height="240" rx="6" fill="#1e293b" stroke="#d946ef" stroke-width="1.5" filter="url(#shadowErd)"/>
  <rect x="680" y="80" width="280" height="32" rx="6" fill="#c026d3"/>
  <text x="695" y="102" fill="#ffffff" font-family="'Consolas', monospace" font-size="13" font-weight="bold">executed_orders</text>

  <g font-family="'Consolas', monospace" font-size="11">
    <text x="695" y="130" fill="#facc15">PK  order_id : UUID</text>
    <text x="695" y="152" fill="#10b981">FK  signal_id : UUID</text>
    <text x="695" y="174" fill="#e2e8f0">    broker_order_ref : VARCHAR(64)</text>
    <text x="695" y="196" fill="#e2e8f0">    action : VARCHAR(10) [BUY/SELL]</text>
    <text x="695" y="218" fill="#e2e8f0">    quantity : INTEGER</text>
    <text x="695" y="240" fill="#e2e8f0">    entry_price, exit_price : FLOAT</text>
    <text x="695" y="262" fill="#e2e8f0">    gross_pnl, net_pnl : NUMERIC</text>
    <text x="695" y="284" fill="#e2e8f0">    stt_and_taxes : NUMERIC(8,2)</text>
    <text x="695" y="306" fill="#a7f3d0">    state : VARCHAR(20) [FILLED/EXIT]</text>
  </g>

  <!-- Table 4: risk_drawdown_ledger -->
  <rect x="200" y="360" width="280" height="220" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowErd)"/>
  <rect x="200" y="360" width="280" height="32" rx="6" fill="#d97706"/>
  <text x="215" y="382" fill="#ffffff" font-family="'Consolas', monospace" font-size="13" font-weight="bold">risk_drawdown_ledger</text>

  <g font-family="'Consolas', monospace" font-size="11">
    <text x="215" y="410" fill="#facc15">PK  entry_id : BIGSERIAL</text>
    <text x="215" y="432" fill="#d946ef">FK  order_id : UUID</text>
    <text x="215" y="454" fill="#e2e8f0">    current_streak : INTEGER</text>
    <text x="215" y="476" fill="#e2e8f0">    consecutive_losses : INTEGER</text>
    <text x="215" y="498" fill="#e2e8f0">    kelly_fraction : NUMERIC(4,2)</text>
    <text x="215" y="520" fill="#e2e8f0">    allocated_risk_inr : NUMERIC</text>
    <text x="215" y="542" fill="#e2e8f0">    cooldown_until : TIMESTAMPTZ</text>
    <text x="215" y="564" fill="#a7f3d0">    circuit_breaker_active : BOOLEAN</text>
  </g>

  <!-- Table 5: forensic_audit_logs -->
  <rect x="520" y="360" width="280" height="220" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" filter="url(#shadowErd)"/>
  <rect x="520" y="360" width="280" height="32" rx="6" fill="#dc2626"/>
  <text x="535" y="382" fill="#ffffff" font-family="'Consolas', monospace" font-size="13" font-weight="bold">forensic_audit_logs</text>

  <g font-family="'Consolas', monospace" font-size="11">
    <text x="535" y="410" fill="#facc15">PK  audit_id : BIGSERIAL</text>
    <text x="535" y="432" fill="#10b981">FK  signal_id : UUID</text>
    <text x="535" y="454" fill="#e2e8f0">    audit_type : VARCHAR(40)</text>
    <text x="535" y="476" fill="#e2e8f0">    temporal_truth_flag : BOOLEAN</text>
    <text x="535" y="498" fill="#e2e8f0">    spa_p_value : DOUBLE PRECISION</text>
    <text x="535" y="520" fill="#e2e8f0">    simulated_fill_prob : NUMERIC</text>
    <text x="535" y="542" fill="#e2e8f0">    rejection_reason : TEXT</text>
    <text x="535" y="564" fill="#a7f3d0">    logged_at : TIMESTAMPTZ</text>
  </g>

  <!-- Relation Lines -->
  <!-- Table 1 -> Table 2 -->
  <line x1="320" y1="160" x2="360" y2="160" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="320" cy="160" r="3" fill="#38bdf8"/>
  <circle cx="360" cy="160" r="3" fill="#38bdf8"/>

  <!-- Table 2 -> Table 3 -->
  <line x1="640" y1="160" x2="680" y2="160" stroke="#10b981" stroke-width="2"/>
  <circle cx="640" cy="160" r="3" fill="#10b981"/>
  <circle cx="680" cy="160" r="3" fill="#10b981"/>

  <!-- Table 3 -> Table 4 -->
  <path d="M 820 320 L 820 340 L 340 340 L 340 360" stroke="#d946ef" stroke-width="2" fill="none"/>

  <!-- Table 2 -> Table 5 -->
  <path d="M 500 320 L 500 340 L 660 340 L 660 360" stroke="#10b981" stroke-width="2" fill="none"/>
</svg>
