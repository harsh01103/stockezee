<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="umlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowUml">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="12" fill="url(#umlBg)"/>
  
  <!-- Header -->
  <text x="500" y="36" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">UML CLASS DIAGRAM — QUANTITATIVE EXECUTION ARCHITECTURE</text>
  <text x="500" y="56" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Core Domain Model, Inheritance Hierarchies, and Object Responsibilities</text>

  <!-- Class 1: OptionsEngine (Controller) -->
  <rect x="360" y="75" width="280" height="150" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowUml)"/>
  <rect x="360" y="75" width="280" height="28" rx="6" fill="#0284c7"/>
  <text x="500" y="94" text-anchor="middle" fill="#ffffff" font-family="'Consolas', monospace" font-size="12" font-weight="bold">«Controller» OptionsEngine</text>
  <g font-family="'Consolas', monospace" font-size="10.5">
    <text x="375" y="120" fill="#e2e8f0">- rolling_context: pl.DataFrame</text>
    <text x="375" y="136" fill="#e2e8f0">- active_regime: RegimeState</text>
    <text x="375" y="152" fill="#e2e8f0">- latency_tracker: LatencyMonitor</text>
    <line x1="360" y1="160" x2="640" y2="160" stroke="#475569"/>
    <text x="375" y="178" fill="#a7f3d0">+ process_tick_batch(): void</text>
    <text x="375" y="196" fill="#a7f3d0">+ evaluate_execution(): SignalDTO</text>
    <text x="375" y="214" fill="#a7f3d0">+ trip_circuit_breaker(): bool</text>
  </g>

  <!-- Class 2: GreeksSolver (LLVM JIT) -->
  <rect x="40" y="75" width="280" height="150" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadowUml)"/>
  <rect x="40" y="75" width="280" height="28" rx="6" fill="#059669"/>
  <text x="180" y="94" text-anchor="middle" fill="#ffffff" font-family="'Consolas', monospace" font-size="12" font-weight="bold">«JIT-Service» GreeksSolver</text>
  <g font-family="'Consolas', monospace" font-size="10.5">
    <text x="55" y="120" fill="#e2e8f0">- risk_free_rate: float = 0.07</text>
    <text x="55" y="136" fill="#e2e8f0">- strikes_array: np.ndarray[62]</text>
    <line x1="40" y1="145" x2="320" y2="145" stroke="#475569"/>
    <text x="55" y="165" fill="#a7f3d0">+ solve_bs_closed_form(): Tuple</text>
    <text x="55" y="183" fill="#a7f3d0">+ calculate_gamma_explosion(): float</text>
    <text x="55" y="201" fill="#a7f3d0">+ compute_vanna_skew(): float</text>
  </g>

  <!-- Class 3: OrderbookAnalyzer -->
  <rect x="680" y="75" width="280" height="150" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowUml)"/>
  <rect x="680" y="75" width="280" height="28" rx="6" fill="#d97706"/>
  <text x="820" y="94" text-anchor="middle" fill="#ffffff" font-family="'Consolas', monospace" font-size="12" font-weight="bold">«Component» OrderbookAnalyzer</text>
  <g font-family="'Consolas', monospace" font-size="10.5">
    <text x="695" y="120" fill="#e2e8f0">- depth_levels: int = 5</text>
    <text x="695" y="136" fill="#e2e8f0">- decay_lambda: float = 0.40</text>
    <line x1="680" y1="145" x2="960" y2="145" stroke="#475569"/>
    <text x="695" y="165" fill="#a7f3d0">+ compute_vwoim(L5_depth): float</text>
    <text x="695" y="183" fill="#a7f3d0">+ extract_oi_velocity(): float</text>
    <text x="695" y="201" fill="#a7f3d0">+ evaluate_pcr_derivative(): float</text>
  </g>

  <!-- Class 4: ExecutionGate (Adversarial ML) -->
  <rect x="200" y="280" width="280" height="155" rx="6" fill="#1e293b" stroke="#c026d3" stroke-width="1.5" filter="url(#shadowUml)"/>
  <rect x="200" y="280" width="280" height="28" rx="6" fill="#9333ea"/>
  <text x="340" y="299" text-anchor="middle" fill="#ffffff" font-family="'Consolas', monospace" font-size="12" font-weight="bold">«Gate» ExecutionGate</text>
  <g font-family="'Consolas', monospace" font-size="10.5">
    <text x="215" y="325" fill="#e2e8f0">- trained_models: Dict[str, Model]</text>
    <text x="215" y="341" fill="#e2e8f0">- friction_lambda_spread: float = 0.35</text>
    <text x="215" y="357" fill="#e2e8f0">- friction_lambda_tax: float = 0.15</text>
    <line x1="200" y1="365" x2="480" y2="365" stroke="#475569"/>
    <text x="215" y="385" fill="#a7f3d0">+ filter_trade(candidate): bool</text>
    <text x="215" y="403" fill="#a7f3d0">+ predict_rf_probability(): float</text>
    <text x="215" y="421" fill="#a7f3d0">+ log_friction_audit(): void</text>
  </g>

  <!-- Class 5: KellyRiskManager -->
  <rect x="520" y="280" width="280" height="155" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" filter="url(#shadowUml)"/>
  <rect x="520" y="280" width="280" height="28" rx="6" fill="#dc2626"/>
  <text x="660" y="299" text-anchor="middle" fill="#ffffff" font-family="'Consolas', monospace" font-size="12" font-weight="bold">«Manager» KellyRiskManager</text>
  <g font-family="'Consolas', monospace" font-size="10.5">
    <text x="535" y="325" fill="#e2e8f0">- base_budget_inr: float = 1500.0</text>
    <text x="535" y="341" fill="#e2e8f0">- loss_streak: int = 0</text>
    <text x="535" y="357" fill="#e2e8f0">- cooldown_timer: Optional[Timer]</text>
    <line x1="520" y1="365" x2="800" y2="365" stroke="#475569"/>
    <text x="535" y="385" fill="#a7f3d0">+ calculate_position_size(): float</text>
    <text x="535" y="403" fill="#a7f3d0">+ on_trade_close(pnl): void</text>
    <text x="535" y="421" fill="#a7f3d0">+ is_in_cooldown(): bool</text>
  </g>

  <!-- Class 6: AutoTrader & TelegramNotifier -->
  <rect x="360" y="475" width="280" height="125" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowUml)"/>
  <rect x="360" y="475" width="280" height="28" rx="6" fill="#0284c7"/>
  <text x="500" y="494" text-anchor="middle" fill="#ffffff" font-family="'Consolas', monospace" font-size="12" font-weight="bold">«Router» BrokerExecutionRouter</text>
  <g font-family="'Consolas', monospace" font-size="10.5">
    <text x="375" y="520" fill="#e2e8f0">- webhook_url: str = "http://localhost:4000"</text>
    <line x1="360" y1="530" x2="640" y2="530" stroke="#475569"/>
    <text x="375" y="550" fill="#a7f3d0">+ route_market_order(signal): OrderResult</text>
    <text x="375" y="568" fill="#a7f3d0">+ broadcast_telegram_alert(): void</text>
    <text x="375" y="586" fill="#a7f3d0">+ push_supabase_mutation(): void</text>
  </g>

  <!-- Connectors -->
  <line x1="320" y1="150" x2="360" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="640" y1="150" x2="680" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="225" x2="340" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <line x1="570" y1="225" x2="660" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <line x1="340" y1="435" x2="430" y2="475" stroke="#94a3b8" stroke-width="2"/>
  <line x1="660" y1="435" x2="570" y2="475" stroke="#94a3b8" stroke-width="2"/>
</svg>
