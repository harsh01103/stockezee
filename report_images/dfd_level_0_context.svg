<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="950" height="500">
  <defs>
    <linearGradient id="dfdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <filter id="shadowDfd">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="500" rx="12" fill="url(#dfdBg)"/>
  
  <!-- Title -->
  <text x="475" y="38" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">DATA FLOW DIAGRAM (DFD) — LEVEL 0 (CONTEXT DIAGRAM)</text>
  <text x="475" y="58" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Boundary, External Entities, and Core Derivatives Analytics Engine</text>

  <!-- Central Process: 0.0 System -->
  <circle cx="475" cy="260" r="95" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="url(#shadowDfd)"/>
  <text x="475" y="245" text-anchor="middle" fill="#38bdf8" font-family="'Consolas', monospace" font-size="14" font-weight="bold">PROCESS 0.0</text>
  <text x="475" y="268" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">High-Frequency Options</text>
  <text x="475" y="285" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Quantitative Engine</text>
  <text x="475" y="302" text-anchor="middle" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="10">&amp; ML Gating Core</text>

  <!-- External Entity 1: National Stock Exchange (NSE) -->
  <rect x="50" y="100" width="180" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadowDfd)"/>
  <text x="140" y="130" text-anchor="middle" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">EXTERNAL ENTITY</text>
  <text x="140" y="152" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">National Stock Exchange</text>

  <!-- External Entity 2: Upstox Broker Feed -->
  <rect x="50" y="340" width="180" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadowDfd)"/>
  <text x="140" y="370" text-anchor="middle" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">EXTERNAL ENTITY</text>
  <text x="140" y="392" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">Upstox WebSocket V2</text>

  <!-- External Entity 3: Institutional Trader / UI Client -->
  <rect x="720" y="100" width="180" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadowDfd)"/>
  <text x="810" y="130" text-anchor="middle" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">EXTERNAL ENTITY</text>
  <text x="810" y="152" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">Trader / Web Dashboard</text>

  <!-- External Entity 4: Telegram Risk Supervisor -->
  <rect x="720" y="340" width="180" height="70" rx="8" fill="#1e293b" stroke="#d946ef" stroke-width="2" filter="url(#shadowDfd)"/>
  <text x="810" y="370" text-anchor="middle" fill="#e879f9" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">EXTERNAL ENTITY</text>
  <text x="810" y="392" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">Telegram Supervisor</text>

  <!-- Data Flow Lines & Labels -->
  <!-- NSE -> Engine -->
  <path d="M 230 145 L 395 210" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="290" y="170" fill="#fcd34d" font-family="'Consolas', monospace" font-size="10.5">TLS Option Chain (3s)</text>

  <!-- Upstox -> Engine -->
  <path d="M 230 365 L 395 305" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <text x="270" y="345" fill="#93c5fd" font-family="'Consolas', monospace" font-size="10.5">Binary Protobuf Ticks</text>

  <!-- Engine -> Trader -->
  <path d="M 555 210 L 720 145" stroke="#10b981" stroke-width="2" fill="none"/>
  <text x="600" y="170" fill="#6ee7b7" font-family="'Consolas', monospace" font-size="10.5">Live Greeks &amp; PnL Stream</text>

  <!-- Engine -> Telegram -->
  <path d="M 555 305 L 720 365" stroke="#d946ef" stroke-width="2" fill="none"/>
  <text x="590" y="345" fill="#f5d0fe" font-family="'Consolas', monospace" font-size="10.5">Alerts &amp; Kill-Switch ACK</text>
</svg>
