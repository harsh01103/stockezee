version: '3.8'

services:
  quant-telemetry-engine:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: stockezee_quant_engine
    restart: always
    environment:
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - stockezee-network

  redis-cache:
    image: redis:7-alpine
    container_name: stockezee_redis_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - stockezee-network

networks:
  stockezee-network:
    driver: bridge
